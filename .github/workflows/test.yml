name: API Observability & QA Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: API Functional, Negative, Database & Rate Limit Tests
  # -------------------------------------------------------------
  api-and-db-tests:
    name: API & Database Automated Test Suite (Newman + SQL + 101 Breach)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: api_observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            tests/package-lock.json

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -d api_observability -f server/src/db/schema.sql

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install QA Suite Dependencies
        run: |
          cd tests
          npm ci

      - name: Start Server Application
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:root@localhost:5432/api_observability
          REDIS_URL: redis://localhost:6379
          USE_MOCK_REDIS: "false"
          JWT_SECRET: ci_test_secret_jwt_key_987654321
        run: |
          cd server
          node src/app.js > ../server-api.log 2>&1 &
          
      - name: Wait for Server to be Healthy
        run: |
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/health | grep -q "ok"; do sleep 1; done'
          echo "Server is UP and ready for API testing!"

      - name: Execute Automated QA, SQL DB & Rate Limit Test Suite
        env:
          BASE_URL: http://127.0.0.1:5000
          DATABASE_URL: postgresql://postgres:root@localhost:5432/api_observability
        run: |
          cd tests
          npm test

      - name: Upload Newman HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-test-report
          path: tests/reports/index.html
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Selenium WebDriver UI Automation Tests (Java + TestNG)
  # -------------------------------------------------------------
  ui-selenium-tests:
    name: End-to-End UI Automation Suite (Selenium + TestNG)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: api_observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -d api_observability -f server/src/db/schema.sql

      - name: Install Server & Client Dependencies and Build Frontend
        run: |
          cd client && npm ci && npm run build
          cd ../server && npm ci

      - name: Start Platform & Execute Selenium UI Tests
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:root@localhost:5432/api_observability
          REDIS_URL: redis://localhost:6379
          USE_MOCK_REDIS: "false"
          JWT_SECRET: ci_test_secret_jwt_key_987654321
        run: |
          # 1. Start Server in background (serves both API and pre-built React frontend on port 5000)
          cd server
          node src/app.js > ../server-ui.log 2>&1 &
          SERVER_PID=$!
          cd ..

          # 2. Wait for Readiness (both API health and Frontend HTML on port 5000)
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/health | grep -q "ok"; do sleep 1; done'
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5000/login | grep -q "<html"; do sleep 1; done'
          echo "Server & Frontend are UP on port 5000 and ready for Selenium UI testing!"

          # 3. Execute Selenium Headless Tests
          cd tests/ui
          mvn test -Dheadless=true -DbaseUrl=http://127.0.0.1:5000 || {
            echo "❌ Tests failed, dumping diagnostic logs..."
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ]; then
                echo "=== $f ==="
                cat "$f"
              fi
            done
            for f in target/surefire-reports/junitreports/*.xml; do
              if [ -f "$f" ]; then
                echo "=== $f ==="
                cat "$f"
              fi
            done
            if [ -f target/surefire-reports/testng-results.xml ]; then
              echo "=== testng-results.xml ==="
              cat target/surefire-reports/testng-results.xml
            fi
            echo "=== SERVER LOG ==="
            cat ../../server-ui.log 2>/dev/null || true
            exit 1
          }

          # 4. Clean up background process
          kill $SERVER_PID || true

      - name: Upload TestNG HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: tests/ui/target/surefire-reports/
          retention-days: 14

name: API Observability & QA Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated API Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: api_observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            tests/package-lock.json

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -d api_observability -f server/src/db/schema.sql

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install QA Suite Dependencies
        run: |
          cd tests
          npm ci

      - name: Start Server Application
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:root@localhost:5432/api_observability
          REDIS_URL: redis://localhost:6379
          USE_MOCK_REDIS: "false"
          JWT_SECRET: ci_test_secret_jwt_key_987654321
        run: |
          cd server
          npm start &
          
      - name: Wait for Server to be Healthy
        run: |
          timeout 30 bash -c 'until curl -s http://localhost:5000/health | grep -q "ok"; do sleep 1; done'
          echo "Server is UP and ready for testing!"

      - name: Execute Automated QA & Rate Limit Test Suite
        env:
          BASE_URL: http://localhost:5000
        run: |
          cd tests
          npm test

      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-test-report
          path: tests/reports/index.html
          retention-days: 14

server:
  port: 8081

spring:
  application:
    name: analytics-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/api_observability}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: analytics-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        analytics.event.processing: true

app:
  kafka:
    topics:
      requests-raw: api.requests.raw
      rate-limit-violations: api.rate-limit.violations
      health-checks: api.health.checks
      requests-dlq: api.requests.dlq
      health-dlq: api.health.dlq
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0

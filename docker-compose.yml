version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: api-observability-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_docker_pass
      POSTGRES_DB: api_observability
    ports:
      - "5434:5432" # Host port 5434 to avoid host conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: api-observability-redis
    ports:
      - "6380:6379" # Host port 6380
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: api-observability-kafka
    ports:
      - "9092:9092"
    environment:
      # Apache Kafka KRaft Single Node Configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: api-observability-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  api-gateway:
    build: ./server
    container_name: api-observability-gateway
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres_docker_pass@db:5432/api_observability
      REDIS_URL: redis://redis:6379
      USE_MOCK_REDIS: "false"
      KAFKA_BROKERS: kafka:9092
      USE_MOCK_KAFKA: "false"
      JWT_SECRET: super_secret_jwt_token_for_api_observability_platform_docker_98765
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  analytics-service:
    build: ./services/analytics-service
    container_name: api-observability-analytics
    environment:
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://db:5432/api_observability
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_docker_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: api-observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - api-gateway
      - analytics-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: api-observability-grafana
    ports:
      - "3001:3000" # Host port 3001 -> Grafana internal 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  client:
    build: ./client
    container_name: api-observability-client
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - analytics-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
